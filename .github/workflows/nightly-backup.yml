name: Automatic Nightly Database Backup

on:
  schedule:
    # Runs everyday at 12:00 AM IST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Backup Script
        run: node scripts/backup-db.mjs
        env:
          VITE_SUPABASE_URL: "https://qhatwhupcahsfzpjemye.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoYXR3aHVwY2Foc2Z6cGplbXllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NTgzMjMsImV4cCI6MjEwODQzNDMyM30.x_OiF5gPyUqLt5zaKKcrpwY8Wi-LyhzJE6ZkyFF6a3o"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saheb-paper-nightly-backup
          path: backups/
          retention-days: 30
